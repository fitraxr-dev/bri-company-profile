[package]
name = "brimo-backend-rust"
version = "1.0.0"
edition = "2021"
authors = ["BRI Development Team"]
description = "BRImo Backend API - Digital Banking Solution (Rust/Actix-Web)"

[dependencies]
# Web framework
actix-web = "4.9"
actix-cors = "0.7"
actix-rt = "2.10"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

# MongoDB driver
mongodb = "3.1"
bson = { version = "2.13", features = ["chrono-0_4"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Security & Auth
bcrypt = "0.15"
jsonwebtoken = "9.3"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Environment variables
dotenv = "0.15"

# HTTP client (for stock scraping)
reqwest = { version = "0.12", features = ["json"] }

# HTML scraping
scraper = "0.20"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Validation
validator = { version = "0.18", features = ["derive"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Regex
regex = "1.10"
lazy_static = "1.5"

# Random
rand = "0.8"

# URL encoding
urlencoding = "2.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
